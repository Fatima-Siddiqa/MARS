name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend
        id: has
        run: |
          if [ -f frontend/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.yes == 'true'
        with:
          node-version: 20
      - if: steps.has.outputs.yes == 'true'
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
