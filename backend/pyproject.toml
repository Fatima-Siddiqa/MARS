[project]
name = "mars-backend"
version = "0.1.0"
description = "MARS: regime-aware multi-agent system for explainable PSX stock analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "feedparser>=6.0",
  "requests>=2.31",
  "python-dateutil>=2.9",
  "beautifulsoup4>=4.12",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
sentiment-model = ["torch", "transformers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]
