[project]
name = "mars-macro-agent"
version = "0.1.0"
description = "MARS Macroeconomic Indicators Agent for PSX equities (rule-based, as-of-date, explainable)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "pydantic>=2.5",
  "sqlalchemy>=2.0", "fastapi>=0.110", "uvicorn>=0.27", "requests>=2.31",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mlflow = ["mlflow>=2.10"]
ml = ["xgboost>=2.0", "openpyxl>=3.1"]   # `macro-agent ml-eval` (research) and Pink Sheet parsing in `fetch-open`
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
macro-agent = "macro_agent.cli:main"

[tool.setuptools]
packages = ["macro_agent", "macro_agent.loaders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
